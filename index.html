<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drive Terminal - AI Integrated</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <link rel="manifest" href="manifest.json">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; color: #0f0; font-family: monospace; overflow: hidden; display: flex; flex-direction: column; }
        header { background: #111; padding: 10px; display: flex; justify-content: space-between; border-bottom: 1px solid #333; font-size: 12px; }
        .btn-group button { background: #222; color: #fff; border: 1px solid #444; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-left: 5px; }
        
        /* AI Assistant Bar */
        #ai-bar { background: #1a1a1a; padding: 8px; border-bottom: 1px solid #333; display: flex; gap: 8px; }
        #ai-input { flex: 1; background: #000; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 4px; font-size: 13px; }
        #ai-ask-btn { background: #4285f4; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        
        #main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        #terminal-container { flex: 1; background: #000; padding: 5px; }
        
        #ai-response-overlay {
            display: none; position: absolute; top: 0; left: 0; right: 0; background: #222; 
            z-index: 100; padding: 15px; border-bottom: 2px solid #4285f4; color: #eee;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .ai-code-block { background: #000; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #333; color: #0f0; overflow-x: auto; }
        
        footer { background: #111; border-top: 1px solid #333; padding: 8px 5px; }
        .mobile-keys { display: flex; gap: 5px; overflow-x: auto; }
        .key-btn { background: #1f1f1f; color: #fff; border: 1px solid #333; padding: 12px; border-radius: 6px; min-width: 60px; font-weight: bold; }
        #screen-container { display: none; }
    </style>
</head>
<body>
    <header>
        <div class="status-info">Drive: <span id="drive-status" style="color:#ff4444">Off</span></div>
        <div class="btn-group">
            <button id="toggle-explorer">EXPLORER</button>
            <button id="connect-drive">LOGIN</button>
            <button onclick="syncToDrive()">SYNC</button>
        </div>
    </header>

    <div id="ai-bar">
        <input type="text" id="ai-input" placeholder="ถาม AI (เช่น: ติดตั้ง Python ยังไง?)">
        <button id="ai-ask-btn">ASK AI</button>
    </div>

    <div id="main-container">
        <div id="ai-response-overlay">
            <div id="ai-text"></div>
            <div class="ai-code-block" id="ai-code"></div>
            <div class="btn-group">
                <button id="run-ai-code" style="background:#0f0; color:#000">RUN IN TERMINAL</button>
                <button id="close-ai" style="background:#444">CLOSE</button>
            </div>
        </div>
        
        <main id="terminal-container"></main>
    </div>

    <div id="screen-container"></div>

    <footer>
        <div class="mobile-keys">
            <button class="key-btn" onclick="sendKey('Tab')">TAB</button>
            <button class="key-btn" onclick="sendKey('Escape')">ESC</button>
            <button class="key-btn" onclick="sendKey('ArrowUp')">↑</button>
            <button class="key-btn" onclick="sendKey('ArrowDown')">↓</button>
            <button class="key-btn" onclick="sendKey('ArrowLeft')">←</button>
            <button class="key-btn" onclick="sendKey('ArrowRight')">→</button>
        </div>
    </footer>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://copy.sh/v86/libv86.js"></script>
    <script src="app.js"></script>
</body>
</html>
