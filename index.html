<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Drive Terminal - Creator Edition</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
    <link rel="manifest" href="manifest.json">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; color: #0f0; font-family: monospace; overflow: hidden; display: flex; flex-direction: column; }
        header { background: #111; padding: 10px; display: flex; justify-content: space-between; border-bottom: 1px solid #333; font-size: 12px; }
        .btn-group button { background: #222; color: #fff; border: 1px solid #444; padding: 5px 10px; border-radius: 4px; cursor: pointer; margin-left: 5px; }
        
        #main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        #terminal-container { flex: 1; background: #000; padding: 5px; }
        
        /* Editor Modal */
        #editor-overlay {
            display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; padding: 20px;
        }
        #editor-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        #editor-textarea { flex: 1; background: #111; color: #fff; border: 1px solid #333; padding: 10px; font-family: monospace; font-size: 14px; resize: none; }
        
        #drive-explorer {
            width: 250px; background: #0a0a0a; border-left: 1px solid #333;
            display: none; flex-direction: column; z-index: 50;
            position: absolute; right: 0; top: 0; bottom: 0;
        }
        #explorer-header { padding: 10px; background: #1a1a1a; border-bottom: 1px solid #333; font-weight: bold; }
        #file-list { flex: 1; overflow-y: auto; padding: 0; list-style: none; margin: 0; }
        #file-list li { padding: 10px; border-bottom: 1px solid #1a1a1a; cursor: pointer; color: #888; }
        #file-list li:hover { background: #1a1a1a; color: #0f0; }
        
        footer { background: #111; border-top: 1px solid #333; padding: 8px 5px; }
        .mobile-keys { display: flex; gap: 5px; overflow-x: auto; }
        .key-btn { background: #1f1f1f; color: #fff; border: 1px solid #333; padding: 12px; border-radius: 6px; min-width: 60px; font-weight: bold; }
        #screen-container { display: none; }
    </style>
</head>
<body>
    <header>
        <div class="status-info">Drive: <span id="drive-status" style="color:#ff4444">Off</span></div>
        <div class="btn-group">
            <button id="new-file">NEW FILE</button>
            <button id="toggle-explorer">EXPLORER</button>
            <button id="connect-drive">LOGIN</button>
            <button onclick="syncToDrive()">SYNC</button>
        </div>
    </header>

    <div id="main-container">
        <main id="terminal-container"></main>
        
        <!-- Text Editor Overlay -->
        <div id="editor-overlay">
            <div id="editor-header">
                <span id="editing-filename" style="color:#0f0">New File</span>
                <div class="btn-group">
                    <button id="save-editor">SAVE TO DRIVE</button>
                    <button id="close-editor" style="background:#442222">CLOSE</button>
                </div>
            </div>
            <textarea id="editor-textarea" spellcheck="false"></textarea>
        </div>

        <aside id="drive-explorer">
            <div id="explorer-header">Google Drive</div>
            <ul id="file-list"></ul>
        </aside>
    </div>

    <div id="screen-container"></div>

    <footer>
        <div class="mobile-keys">
            <button class="key-btn" onclick="sendKey('Tab')">TAB</button>
            <button class="key-btn" onclick="sendKey('Escape')">ESC</button>
            <button class="key-btn" onclick="sendKey('ArrowUp')">↑</button>
            <button class="key-btn" onclick="sendKey('ArrowDown')">↓</button>
            <button class="key-btn" onclick="sendKey('ArrowLeft')">←</button>
            <button class="key-btn" onclick="sendKey('ArrowRight')">→</button>
        </div>
    </footer>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="https://copy.sh/v86/libv86.js"></script>
    <script src="app.js"></script>
</body>
</html>
