<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Video</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Text to Video Generator</h1>
        <form action="/generate" method="post" id="generator-form">
            <label for="video-text" class="visually-hidden">Text for video</label>
            <textarea id="video-text" name="text" rows="10" cols="50" placeholder="Enter your text here..." maxlength="500" required></textarea>
            <div class="char-count" aria-live="polite">
                <span id="char-count">0</span>/500 characters
            </div>
            <br>
            <input type="submit" value="Generate Video" id="submit-btn">
        </form>

        <script>
            const textarea = document.getElementById('video-text');
            const charCount = document.getElementById('char-count');
            const form = document.getElementById('generator-form');
            const submitBtn = document.getElementById('submit-btn');

            function updateCount() {
                charCount.textContent = textarea.value.length;
            }

            textarea.addEventListener('input', updateCount);

            // Initialize count on load
            window.addEventListener('DOMContentLoaded', updateCount);

            form.addEventListener('submit', () => {
                // Use setTimeout to ensure the browser processes the form submission
                // before the button is disabled
                setTimeout(() => {
                    submitBtn.disabled = true;
                    submitBtn.value = 'Generating Video...';
                    submitBtn.style.opacity = '0.7';
                    submitBtn.style.cursor = 'not-allowed';
                }, 0);
            });
        </script>
        {% if video_path %}
        <div class="video-container">
            <h2>Generated Video:</h2>
            <video width="640" height="360" controls>
                <source src="{{ video_path }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        {% endif %}
    </div>
</body>
</html>
