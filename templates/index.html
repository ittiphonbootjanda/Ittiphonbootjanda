<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Video - Google Veo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Text to Video Generator</h1>
        <p class="subtitle">Powered by Google Veo 3.1</p>

        <div id="error-container" class="error-container" style="display: none;">
            <p id="error-message" style="color: #ff4444;"></p>
        </div>

        <form id="generate-form">
            <textarea id="prompt-text" name="text" rows="5" placeholder="Enter your text prompt here... e.g., 'A futuristic city at sunset with flying cars'"></textarea>

            <div class="options-grid">
                <div class="option-group">
                    <label for="aspect_ratio">Aspect Ratio</label>
                    <select id="aspect_ratio" name="aspect_ratio">
                        <option value="16:9">16:9 (Landscape)</option>
                        <option value="9:16">9:16 (Portrait)</option>
                    </select>
                </div>
                <div class="option-group">
                    <label for="resolution">Resolution</label>
                    <select id="resolution" name="resolution">
                        <option value="720p">720p</option>
                        <option value="1080p">1080p</option>
                        <option value="4k">4k</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="generate-btn">Generate Video</button>
        </form>

        <div id="loading" class="status-container" style="display: none;">
            <div class="spinner"></div>
            <p id="status-text">Starting generation...</p>
            <p class="note">This usually takes 1-3 minutes. Please stay on this page.</p>
        </div>

        <div id="video-result" class="video-container" style="display: none;">
            <h2>Generated Video:</h2>
            <video id="output-video" width="640" controls>
                <source src="" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <br>
            <a id="download-link" href="" download class="download-btn">Download Video</a>
        </div>
    </div>

    <script>
        document.getElementById('generate-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const btn = document.getElementById('generate-btn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('video-result');
            const errorContainer = document.getElementById('error-container');
            const statusText = document.getElementById('status-text');

            // Reset UI
            errorContainer.style.display = 'none';
            result.style.display = 'none';
            loading.style.display = 'block';
            btn.disabled = true;
            statusText.innerText = "Requesting video generation...";

            const formData = new FormData(form);

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    const videoElement = document.getElementById('output-video');
                    const downloadLink = document.getElementById('download-link');

                    videoElement.src = data.video_path;
                    videoElement.load();
                    downloadLink.href = data.video_path;

                    result.style.display = 'block';
                } else {
                    document.getElementById('error-message').innerText = data.error || "An unknown error occurred.";
                    errorContainer.style.display = 'block';
                }
            } catch (err) {
                document.getElementById('error-message').innerText = "Network error or server timeout. The generation might still be running.";
                errorContainer.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
