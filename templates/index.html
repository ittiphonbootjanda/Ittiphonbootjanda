<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Video</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Text to Video Generator</h1>
        <form action="/generate" method="post" onsubmit="document.getElementById('s').disabled=true;document.getElementById('s').value='Generating...';">
            <label for="t" class="label">Text for video:</label>
            <textarea id="t" name="text" rows="10" cols="50" placeholder="Enter your text here..." required maxlength="500" oninput="document.getElementById('c').innerText = this.value.length + ' / 500'"></textarea>
            <div id="c" class="char-count" aria-live="polite" aria-atomic="true">0 / 500</div>
            <input type="submit" id="s" value="Generate Video">
        </form>
        {% if video_path %}
        <div class="video-container">
            <h2>Generated Video:</h2>
            <video width="640" height="360" controls>
                <source src="{{ video_path }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        {% endif %}
    </div>
</body>
</html>
