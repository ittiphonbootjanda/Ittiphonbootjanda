<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Video</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Text to Video Generator</h1>
        <form id="generator-form" action="/generate" method="post">
            <label for="video-text" class="visually-hidden">Text for video</label>
            <textarea id="video-text" name="text" rows="10" cols="50" placeholder="Enter your text here..." required maxlength="500"></textarea>
            <div id="char-count" class="char-count" aria-live="polite">0 / 500</div>
            <input type="submit" id="submit-btn" value="Generate Video">
        </form>

        <script>
            const form = document.getElementById('generator-form');
            const textarea = document.getElementById('video-text');
            const charCount = document.getElementById('char-count');
            const submitBtn = document.getElementById('submit-btn');

            function updateCount() {
                const length = textarea.value.length;
                charCount.textContent = `${length} / 500`;
            }

            textarea.addEventListener('input', updateCount);

            // Initialize count on load
            window.addEventListener('DOMContentLoaded', updateCount);

            form.addEventListener('submit', () => {
                setTimeout(() => {
                    submitBtn.disabled = true;
                    submitBtn.value = 'Generating Video...';
                }, 0);
            });
        </script>
        {% if video_path %}
        <div class="video-container">
            <h2>Generated Video:</h2>
            <video width="640" height="360" controls>
                <source src="{{ video_path }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        {% endif %}
    </div>
</body>
</html>
