<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Video</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Text to Video Generator</h1>
        <form action="/generate" method="post" id="gen-form">
            <label for="video-text">Describe your video content</label>
            <textarea id="video-text" name="text" rows="10" cols="50" placeholder="Enter your text here..." required></textarea>
            <br>
            <input type="submit" id="submit-btn" value="Generate Video">
        </form>
        <script>
            document.getElementById('gen-form').addEventListener('submit', function() {
                const btn = document.getElementById('submit-btn');
                btn.value = 'Generating...';
                btn.disabled = true;
            });
        </script>
        {% if video_path %}
        <div class="video-container">
            <h2>Generated Video:</h2>
            <video width="640" height="360" controls>
                <source src="{{ video_path }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        {% endif %}
    </div>
</body>
</html>
