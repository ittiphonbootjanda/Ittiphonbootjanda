<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Video</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Text to Video Generator</h1>
        <form action="/generate" method="post" id="generator-form">
            <label for="video-text" class="visually-hidden">Text to generate video from</label>
            <textarea name="text" id="video-text" rows="10" cols="50" placeholder="Enter your text here..." maxlength="500"></textarea>
            <br>
            <input type="submit" id="submit-btn" value="Generate Video">
        </form>
        {% if video_path %}
        <div class="video-container">
            <h2>Generated Video:</h2>
            <video width="640" height="360" controls>
                <source src="{{ video_path }}" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        {% endif %}
    </div>
    <script>
        document.getElementById('generator-form').addEventListener('submit', function() {
            const submitBtn = document.getElementById('submit-btn');
            // Use setTimeout to allow the form to actually submit before disabling the button
            setTimeout(() => {
                submitBtn.disabled = true;
                submitBtn.value = 'Generating...';
            }, 0);
        });
    </script>
</body>
</html>
